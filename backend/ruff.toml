# Lives here rather than in pyproject.toml: Vercel's Python runtime treats a
# pyproject.toml as the dependency file and then ignores requirements.txt,
# which deployed the API with no packages at all.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "UP046",  # PEP 695 generics; pydantic's Generic[T] is the documented pattern
    "UP042",  # StrEnum vs (str, Enum); both work, this is what's used throughout
]
